session_name: solana-localnet
before_script: ./setup_localnet.sh

windows:
    - window_name: solana
      layout: tiled
      panes:
          - shell_command:
                - solana-test-validator --reset
          - shell_command:
                - sleep 10
                - ./print_accounts.sh
          - shell_command:
                - sleep 10
                - ./deploy_program.sh
          - shell_command:
                - sleep 12
                - ./mint_and_fund_token.sh
